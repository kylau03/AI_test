<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hello World · DeepSeek Test</title>
<style>
  :root {
    --bg: #0b1020; --panel: #131a2e; --panel-2: #1a2340;
    --border: #253156; --text: #e7ecf7; --muted: #8b98b8;
    --accent: #4f8cff; --accent-2: #9b5cff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(1200px 700px at 15% -10%, #1d2a55 0%, transparent 60%),
                radial-gradient(900px 600px at 110% 10%, #3a1d55 0%, transparent 55%),
                var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; justify-content: center; padding: 24px 16px;
  }
  .app { width: 100%; max-width: 780px; display: flex; flex-direction: column; gap: 18px; min-height: 0; }
  header { text-align: center; }
  h1 {
    margin: 8px 0 6px; font-size: clamp(32px, 7vw, 52px); letter-spacing: -0.02em;
    background: linear-gradient(90deg, #7fb0ff, #b98cff, #7fe3ff);
    -webkit-background-clip: text; background-clip: text; color: transparent; font-weight: 800;
  }
  .sub { margin: 0; color: var(--muted); font-size: 14px; }
  .chat {
    flex: 1; min-height: 0; display: flex; flex-direction: column;
    background: rgba(19, 26, 46, 0.75); backdrop-filter: blur(12px);
    border: 1px solid var(--border); border-radius: 18px; overflow: hidden;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
  }
  .chat-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 13px; color: var(--muted);
  }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #3ddc84; margin-right: 7px; box-shadow: 0 0 10px #3ddc84; }
  .dot.off { background: #ff6b6b; box-shadow: 0 0 10px #ff6b6b; }
  .clear {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    border-radius: 8px; padding: 5px 10px; font-size: 12px; cursor: pointer; transition: 0.15s;
  }
  .clear:hover { color: var(--text); border-color: var(--accent); }
  .messages { flex: 1; overflow-y: auto; padding: 18px 14px; display: flex; flex-direction: column; gap: 14px; scroll-behavior: smooth; }
  .msg { display: flex; gap: 10px; max-width: 92%; animation: pop 0.2s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .avatar { width: 30px; height: 30px; flex: 0 0 30px; border-radius: 9px; display: grid; place-items: center; font-size: 15px; background: var(--panel-2); border: 1px solid var(--border); }
  .msg.user .avatar { background: linear-gradient(135deg, var(--accent), var(--accent-2)); border: none; }
  .bubble { padding: 11px 14px; border-radius: 14px; line-height: 1.6; font-size: 14.5px; background: var(--panel-2); border: 1px solid var(--border); word-wrap: break-word; overflow-wrap: anywhere; }
  .msg.user .bubble { background: linear-gradient(135deg, #2f62d6, #6a3fd6); border: none; color: #fff; }
  .bubble pre { background: #0a0f1e; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; overflow-x: auto; margin: 8px 0; font-size: 13px; }
  .bubble code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: rgba(255,255,255,0.08); padding: 1px 5px; border-radius: 5px; font-size: 13px; }
  .bubble pre code { background: none; padding: 0; }
  .composer { display: flex; gap: 10px; padding: 12px; border-top: 1px solid var(--border); background: rgba(11,16,32,0.6); }
  textarea { flex: 1; resize: none; background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 12px; padding: 11px 14px; font: inherit; font-size: 14.5px; outline: none; max-height: 160px; transition: border-color 0.15s; }
  textarea:focus { border-color: var(--accent); }
  button.send { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; border: none; border-radius: 12px; padding: 0 20px; font-weight: 600; font-size: 14px; cursor: pointer; transition: 0.15s; }
  button.send:hover:not(:disabled) { filter: brightness(1.12); }
  button.send:disabled { opacity: 0.45; cursor: not-allowed; }
  .typing span { display: inline-block; width: 6px; height: 6px; margin-right: 3px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 60%, 100% { opacity: 0.25; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }
  .hint { color: var(--muted); font-size: 13px; text-align: center; padding: 20px; }
  @media (max-width: 520px) { body { padding: 12px 8px; } .msg { max-width: 100%; } }
</style>
</head>
<body>

<div class="app">
  <header>
    <h1>Hello, World!</h1>
    <p class="sub">纯静态测试页 · 前端直连 DeepSeek API</p>
  </header>

  <main class="chat">
    <div class="chat-bar">
      <span><span class="dot" id="statusDot"></span><span id="statusText">就绪</span></span>
      <button class="clear" id="clearBtn" type="button">清空</button>
    </div>

    <div class="messages" id="messages">
      <div class="hint">发送一条消息开始测试吧。</div>
    </div>

    <form class="composer" id="composer">
      <textarea id="input" rows="1" placeholder="问我任何问题…（Enter 发送，Shift+Enter 换行）"></textarea>
      <button class="send" id="sendBtn" type="submit">发送</button>
    </form>
  </main>
</div>

<script>
(() => {
  /* =====================================================
     ⚠️ 测试用：把下面替换成你的真实 Key
     ===================================================== */
  const API_KEY = 'sk-ae4181cacc284bebb76b35d0827fa950';

  const API_URL = 'https://api.deepseek.com/chat/completions';
  const MODEL = 'deepseek-flash';
  const SYSTEM_PROMPT = 'You are a friendly, helpful assistant. Answer concisely. Use Markdown code blocks when showing code.';

  const messagesEl = document.getElementById('messages');
  const inputEl    = document.getElementById('input');
  const formEl     = document.getElementById('composer');
  const sendBtn    = document.getElementById('sendBtn');
  const clearBtn   = document.getElementById('clearBtn');
  const statusDot  = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');

  let history = [{ role: 'system', content: SYSTEM_PROMPT }];
  let busy = false;

  /* ---------- 状态 ---------- */
  const keyReady = API_KEY && !API_KEY.startsWith('YOUR_');
  statusDot.classList.toggle('off', !keyReady);
  statusText.textContent = keyReady ? '已配置 Key · 可聊天' : '未配置 Key（请修改 API_KEY 常量）';
  if (!keyReady) {
    messagesEl.innerHTML = '<div class="hint">请在 HTML 中把 <code>API_KEY</code> 替换成你的 DeepSeek Key。</div>';
  }

  /* ---------- Markdown 渲染（完整版） ---------- */
  const escapeHtml = (s) => s.replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));

  function render(md) {
    const parts = String(md).split(/```(\w*)\n?([\s\S]*?)```/g);
    let html = '';
    for (let i = 0; i < parts.length; i += 3) {
      html += inline(parts[i]);
      if (parts[i + 1] !== undefined) {
        html += `<pre><code>${escapeHtml(parts[i + 2] || '')}</code></pre>`;
      }
    }
    return html;
  }
  function inline(text) {
    let s = escapeHtml(text);
    s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/\n/g, '<br>');
    return s;
  }

  /* ---------- 消息渲染 ---------- */
  function addMessage(role, content) {
    const wrap = document.createElement('div');
    wrap.className = `msg ${role}`;
    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'user' ? '🧑' : '🤖';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = render(content);
    wrap.appendChild(avatar);
    wrap.appendChild(bubble);
    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return bubble;
  }

  function addTyping() {
    const wrap = document.createElement('div');
    wrap.className = 'msg assistant';
    wrap.innerHTML = `<div class="avatar">🤖</div>
      <div class="bubble typing"><span></span><span></span><span></span></div>`;
    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return wrap;
  }

  /* ---------- 发送消息（流式） ---------- */
  async function send(text) {
    if (busy) return;
    if (!keyReady) { alert('请先在 HTML 中填写 API_KEY'); return; }

    busy = true;
    sendBtn.disabled = true;
    inputEl.value = '';
    inputEl.style.height = 'auto';

    // 首次发送前清掉 hint
    const hint = messagesEl.querySelector('.hint');
    if (hint) hint.remove();

    addMessage('user', text);
    history.push({ role: 'user', content: text });

    const typing = addTyping();
    let bubble = null;
    let full = '';

    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${API_KEY}`
        },
        body: JSON.stringify({
          model: MODEL,
          messages: history,
          stream: true
        })
      });

      if (!res.ok) {
        const errText = await res.text();
        throw new Error(`HTTP ${res.status}: ${errText.slice(0, 300)}`);
      }
      if (!res.body) throw new Error('当前浏览器不支持流式读取。');

      typing.remove();
      bubble = addMessage('assistant', '');
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop();

        for (const line of lines) {
          const trimmed = line.trim();
          if (!trimmed.startsWith('data:')) continue;
          const data = trimmed.slice(5).trim();
          if (data === '[DONE]') continue;
          try {
            const json = JSON.parse(data);
            const delta = json.choices?.[0]?.delta?.content || '';
            if (delta) {
              full += delta;
              bubble.innerHTML = render(full);
              messagesEl.scrollTop = messagesEl.scrollHeight;
            }
          } catch (_) { /* 忽略不完整 JSON */ }
        }
      }

      if (!full) {
        bubble.innerHTML = '<span class="error">（空响应）</span>';
      } else {
        history.push({ role: 'assistant', content: full });
      }
    } catch (err) {
      typing.remove();
      const msg = String(err.message || err);
      let hintMsg = msg;
      if (/Failed to fetch|NetworkError|CORS/i.test(msg)) {
        hintMsg = '请求失败：可能是 CORS 限制或网络问题。请按 F12 打开控制台查看具体错误。若为 CORS，纯静态方案无法绕过，需要边缘函数中转。';
      } else if (/401|403/.test(msg)) {
        hintMsg = 'API Key 无效或无权限（401/403）。请检查 API_KEY 是否正确。';
      } else if (/429/.test(msg)) {
        hintMsg = '请求过于频繁或额度不足（429）。';
      } else if (/400/.test(msg)) {
        hintMsg = '请求参数错误（400）。详情：' + msg;
      }
      addMessage('assistant', `❌ ${hintMsg}`);
    } finally {
      busy = false;
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  /* ---------- 事件 ---------- */
  formEl.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = inputEl.value.trim();
    if (text) send(text);
  });

  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      const text = inputEl.value.trim();
      if (text) send(text);
    }
  });

  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
  });

  clearBtn.addEventListener('click', () => {
    history = [{ role: 'system', content: SYSTEM_PROMPT }];
    messagesEl.innerHTML = '<div class="hint">对话已清空。</div>';
  });
})();
</script>
</body>
</html>
